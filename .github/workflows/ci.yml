name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint Check
        run: bun run lint

      - name: Type Check
        working-directory: ./apps/desktop
        run: bun run typecheck

      - name: Build
        working-directory: ./apps/desktop
        run: bun run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: apps/desktop/dist/
          retention-days: 1

  lighthouse-desktop:
    name: Lighthouse Audit (Desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: apps/desktop/dist/

      - name: Run Lighthouse CI
        id: lhci-desktop
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./apps/desktop/lighthouserc.json
          uploadArtifacts: true
          artifactName: desktop-lighthouse-reports

      - name: Write Lighthouse Job Summary
        if: always()
        run: node .github/scripts/lighthouse-summary.mjs

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit Tests
        working-directory: ./apps/desktop
        run: bun run test

  endpoints:
    name: Check Endpoints Health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Endpoints
        run: bun run check:endpoints

  rust:
    name: Backend (Rust) — ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macos-x64
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Cargo Check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --target ${{ matrix.target }}

      - name: Cargo Test
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --target ${{ matrix.target }}

      - name: Cargo Clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --target ${{ matrix.target }} -- -D warnings


  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: ./apps/desktop
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        run: bun run desktop:test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/desktop/playwright-report/
          retention-days: 7

  website:
    name: Landing Page (Astro)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Type Check
        working-directory: ./apps/website
        run: bun run check

      - name: Build
        working-directory: ./apps/website
        run: bun run build

      - name: Upload website dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: apps/website/dist/
          retention-days: 1

  lighthouse-website:
    name: Lighthouse Audit (Website)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: website
    steps:
      - uses: actions/checkout@v4

      - name: Download website dist artifact
        uses: actions/download-artifact@v4
        with:
          name: website-dist
          path: apps/website/dist/

      - name: Run Lighthouse CI
        id: lhci-website
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./apps/website/lighthouserc.json
          uploadArtifacts: true
          artifactName: website-lighthouse-reports

      - name: Write Lighthouse Job Summary
        if: always()
        run: node .github/scripts/lighthouse-summary.mjs

